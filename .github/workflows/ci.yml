name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Set up native test environment
        uses: ./.github/actions/setup-native-test-environment
      - name: Select pinned package and Rust toolchains
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          rust_pin=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$rust_pin" --profile minimal --component rustfmt --component clippy
      - name: Prepare worktree
        run: npm run dev:prepare
      - name: Run repository checks and retain evidence
        run: npm run verify
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: /var/tmp/codex/roonscape/review.*
          if-no-files-found: warn
