name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Validate release source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          npm run check:versions
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "::error title=Release tag mismatch::Expected ${expected_tag}, received ${GITHUB_REF_NAME}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "::error title=Invalid release source::Tag ${GITHUB_REF_NAME} is not reachable from ${DEFAULT_BRANCH}"
            exit 1
          fi
      - name: Set up native test environment
        uses: ./.github/actions/setup-native-test-environment
      - name: Install Node dependencies
        run: npm ci
      - name: Run repository checks
        run: npm run check
      - name: Build release artifacts
        run: npm run package
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/roonscape-linux-x64.tar.gz \
            release/roonscape-linux-x64.tar.gz.sha256 \
            --generate-notes \
            --verify-tag
