name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Validate release source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          npm run check:versions
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "::error title=Release tag mismatch::Expected ${expected_tag}, received ${GITHUB_REF_NAME}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "::error title=Invalid release source::Tag ${GITHUB_REF_NAME} is not reachable from ${DEFAULT_BRANCH}"
            exit 1
          fi
      - name: Set up native test environment
        uses: ./.github/actions/setup-native-test-environment
      - name: Select pinned package and Rust toolchains
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          rust_pin=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$rust_pin" --profile minimal --component rustfmt --component clippy
      - name: Prepare worktree
        run: npm run dev:prepare
      - name: Run checks and design tests
        run: npm run verify -- --design
      - name: Build release artifacts
        run: npm run package
      - name: Store release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: |
            release/roonscape-linux-x64.tar.gz
            release/roonscape-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: /var/tmp/codex/roonscape/review.*
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Retrieve release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release
      - name: Verify release artifacts
        working-directory: release
        run: sha256sum --check roonscape-linux-x64.tar.gz.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/roonscape-linux-x64.tar.gz \
            release/roonscape-linux-x64.tar.gz.sha256 \
            --generate-notes \
            --verify-tag
