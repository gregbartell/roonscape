name: Set up native test environment
description: Install the shared native dependencies required by repository checks

runs:
  using: composite
  steps:
    - name: Install native test dependencies
      shell: bash
      run: |
        mapfile -t packages < <(node -p 'require("./scripts/development-host-packages.json").ubuntu.join("\n")')
        sudo apt-get update
        sudo apt-get install --yes "${packages[@]}"
