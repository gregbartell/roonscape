[package]
name = "roonscape-renderer"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[dependencies]
gdk-pixbuf = "0.21.5"
gtk = { package = "gtk4", version = "0.10.2", features = ["v4_6"] }
jsonschema = { version = "0.49.9", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"
