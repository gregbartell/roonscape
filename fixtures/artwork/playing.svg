<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title description">
  <title id="title">Synthetic artwork for the Playing fixture</title>
  <desc id="description">Layered lapis arches rise above a rose horizon and a small saffron moon.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11131f"/>
      <stop offset="0.52" stop-color="#28315f"/>
      <stop offset="1" stop-color="#5969c7"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cb6e7f"/>
      <stop offset="1" stop-color="#6d354f"/>
    </linearGradient>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#sky)"/>
  <circle cx="895" cy="268" r="132" fill="#eabf68" opacity=".23" filter="url(#soft-glow)"/>
