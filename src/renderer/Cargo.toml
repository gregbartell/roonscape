[package]
name = "roonscape-renderer"
version = "1.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/gregbartell/roonscape"

[dependencies]
gdk-pixbuf = "0.21.5"
gtk = { package = "gtk4", version = "0.10.2", features = ["v4_6"] }
jsonschema = { version = "0.49.9", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["parsing"] }

[dev-dependencies]
pangocairo = "0.21.5"
tempfile = "3.27.0"
